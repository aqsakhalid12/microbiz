<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings - MicroBiz</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <div id="app">
      <div id="app-sidebar"></div>
      <div class="app-main">
        <header id="app-topbar"></header>
        <main class="app-content">
          <!-- Page header -->
          <div class="page-header">
            <div class="d-flex align-items-center gap-2">
              <i class="bi bi-gear page-header-icon"></i>
              <div>
                <h1 class="page-header-title">Settings</h1>
                <p class="page-header-subtitle">Manage your business settings.</p>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-body">
              <div id="settings-loading" class="placeholder-glow">
                <span class="placeholder col-12" style="height: 200px"></span>
              </div>
              <form id="settings-form" novalidate style="display:none">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="business_name" class="form-label">Business name *</label>
                    <input type="text" class="form-control" id="business_name" name="business_name" maxlength="150" required />
                    <div class="invalid-feedback"></div>
                  </div>
                  <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" maxlength="255" />
                    <div class="invalid-feedback"></div>
                  </div>
                  <div class="col-md-6">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="text" class="form-control" id="phone" name="phone" maxlength="30" />
                    <div class="invalid-feedback"></div>
                  </div>
                  <div class="col-md-6">
                    <label for="currency_code" class="form-label">Currency</label>
                    <select class="form-select" id="currency_code" name="currency_code">
                      <option value="USD">USD</option>
                      <option value="EUR">EUR</option>
                      <option value="GBP">GBP</option>
                      <option value="PKR">PKR</option>
                      <option value="INR">INR</option>
                      <option value="AED">AED</option>
                      <option value="SAR">SAR</option>
                      <option value="CAD">CAD</option>
                      <option value="AUD">AUD</option>
                    </select>
                    <div class="invalid-feedback"></div>
                  </div>
                  <div class="col-md-6">
                    <label for="default_low_stock_threshold" class="form-label">Default low-stock threshold</label>
                    <input type="number" class="form-control" id="default_low_stock_threshold" name="default_low_stock_threshold" min="0" step="1" />
                    <div class="form-text">Products at or below this number are shown as low stock</div>
                    <div class="invalid-feedback"></div>
                  </div>
                  <div class="col-12">
                    <label for="address" class="form-label">Address</label>
                    <textarea class="form-control" id="address" name="address" rows="3" maxlength="500"></textarea>
                    <div class="invalid-feedback"></div>
                  </div>
                </div>
              </form>
            </div>
            <div class="card-footer d-flex align-items-center gap-2">
              <button type="submit" class="btn btn-primary" id="settings-save" form="settings-form">
                <i class="bi bi-save me-1"></i> Save
              </button>
              <div id="settings-status" class="text-muted small"></div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/pages/settings.js"></script>
  </body>
</html>
