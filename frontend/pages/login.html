<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — MicroBiz</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body class="auth-page d-flex align-items-center justify-content-center py-4">
  <main class="auth-card card shadow">
    <div class="text-center mb-4">
      <h1 class="h3 mb-0">MicroBiz</h1>
      <p class="text-muted mb-0">Log in to your account</p>
    </div>

    <!-- Server error alert (generic message from API) -->
    <div id="server-error" class="alert alert-danger d-none" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label fw-medium">Email address</label>
        <input type="email" class="form-control" id="email" name="email"
               autocomplete="email" required>
        <div class="invalid-feedback"></div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label fw-medium">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" name="password"
                 autocomplete="current-password" required>
          <button class="btn btn-outline-secondary" type="button"
                  id="toggle-password" aria-label="Show password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <div class="invalid-feedback"></div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2"
              id="submit-btn">Log in</button>
    </form>

    <div class="text-center mt-3">
      <p class="mb-0">
        Don't have an account? <a href="/register" class="link-primary">Register</a>
      </p>
    </div>
  </main>

  <div idtoast-container"></div>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
