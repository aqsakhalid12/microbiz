<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products — MicroBiz</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <div id="app">
      <div id="app-sidebar"></div>
      <div class="app-main">
        <header id="app-topbar"></header>
        <main class="app-content">
          <!-- Page header -->
          <div class="d-sm-flex d-block justify-content-between align-items-center mb-4">
            <h1 class="h4 mb-0">Products</h1>
            <button type="button" class="btn btn-primary" id="add-product-btn">
              <i class="bi bi-plus-lg me-1"></i> Add product
            </button>
          </div>

          <!-- Filter bar -->
          <div class="card mb-3">
            <div class="card-body">
              <div class="row g-3 align-items-end">
                <div class="col-md-4">
                  <label for="search-input" class="form-label">Search</label>
                  <input type="text" class="form-control" id="search-input" placeholder="Search by name or SKU..." />
                </div>
                <div class="col-md-2">
                  <label for="category-filter" class="form-label">Category</label>
                  <select class="form-select" id="category-filter">
                    <option value="">All Categories</option>
                  </select>
                </div>
                <div class="col-md-2">
                  <label for="stock-filter" class="form-label">Stock</label>
                  <select class="form-select" id="stock-filter">
                    <option value="">All Stock</option>
                    <option value="low">Low Stock</option>
                    <option value="out">Out of Stock</option>
                    <option value="in">In Stock</option>
                  </select>
                </div>
                <div class="col-md-2">
                  <label for="sort-select" class="form-label">Sort</label>
                  <select class="form-select" id="sort-select">
                    <option value="name:asc">Name (A-Z)</option>
                    <option value="name:desc">Name (Z-A)</option>
                    <option value="selling_price:asc">Price (low to high)</option>
                    <option value="selling_price:desc">Price (high to low)</option>
                    <option value="stock_quantity:asc">Stock (low to high)</option>
                    <option value="stock_quantity:desc">Stock (high to low)</option>
                    <option value="created_at:desc">Newest first</option>
                    <option value="created_at:asc">Oldest first</option>
                  </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                  <button type="button" class="btn btn-outline-secondary w-100" id="reset-filters-btn">
                    Reset
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Products table / loading / empty / error state -->
          <div class="card">
            <div class="card-body">
              <div id="products-content">
                <!-- Loading skeleton shown initially -->
              </div>
            </div>
          </div>

          <!-- Pagination controls -->
          <div id="pagination-controls" class="mt-3">
            <!-- Filled by products.js -->
          </div>
        </main>
      </div>
    </div>

    <div id="toast-container"></div>

    <!-- Add Product Modal -->
    <div class="modal fade" id="add-product-modal" tabindex="-1" aria-labelledby="add-product-modal-label" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <form id="add-product-form">
            <div class="modal-header">
              <h5 class="modal-title" id="add-product-modal-label">Add Product</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label for="add-name" class="form-label">Name *</label>
                <input type="text" class="form-control" id="add-name" name="name" maxlength="150" required />
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label for="add-sku" class="form-label">SKU</label>
                <input type="text" class="form-control" id="add-sku" name="sku" maxlength="64" />
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label for="add-category" class="form-label">Category</label>
                <input type="text" class="form-control" id="add-category" name="category" maxlength="80" />
                <div class="invalid-feedback"></div>
              </div>
              <div class="row g-3">
                <div class="col-6">
                  <label for="add-selling-price" class="form-label">Selling Price *</label>
                  <input type="number" class="form-control" id="add-selling-price" name="selling_price" step="0.01" min="0" required />
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-6">
                  <label for="add-cost-price" class="form-label">Cost Price *</label>
                  <input type="number" class="form-control" id="add-cost-price" name="cost_price" step="0.01" min="0" required />
                  <div class="invalid-feedback"></div>
                </div>
              </div>
              <div class="mb-3">
                <label for="add-stock" class="form-label">Initial Stock Quantity</label>
                <input type="number" class="form-control" id="add-stock" name="stock_quantity" min="0" value="0" />
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label for="add-image" class="form-label">Image URL</label>
                <input type="url" class="form-control" id="add-image" name="image_url" maxlength="500" placeholder="https://..." />
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label for="add-description" class="form-label">Description</label>
                <textarea class="form-control" id="add-description" name="description" rows="3" maxlength="2000"></textarea>
                <div class="invalid-feedback"></div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary" id="add-product-submit">
                <i class="bi bi-save me-1"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Edit Product Modal -->
    <div class="modal fade" id="edit-product-modal" tabindex="-1" aria-labelledby="edit-product-modal-label" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <form id="edit-product-form">
            <input type="hidden" id="edit-product-id" name="id" />
            <div class="modal-header">
              <h5 class="modal-title" id="edit-product-modal-label">Edit Product</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label for="edit-name" class="form-label">Name *</label>
                <input type="text" class="form-control" id="edit-name" name="name" maxlength="150" required />
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label for="edit-sku" class="form-label">SKU</label>
                <input type="text" class="form-control" id="edit-sku" name="sku" maxlength="64" />
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label for="edit-category" class="form-label">Category</label>
                <input type="text" class="form-control" id="edit-category" name="category" maxlength="80" />
                <div class="invalid-feedback"></div>
              </div>
              <div class="row g-3">
                <div class="col-6">
                  <label for="edit-selling-price" class="form-label">Selling Price *</label>
                  <input type="number" class="form-control" id="edit-selling-price" name="selling_price" step="0.01" min="0" required />
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-6">
                  <label for="edit-cost-price" class="form-label">Cost Price *</label>
                  <input type="number" class="form-control" id="edit-cost-price" name="cost_price" step="0.01" min="0" required />
                  <div class="invalid-feedback"></div>
                </div>
              </div>
              <div class="mb-3">
                <label for="edit-low-stock" class="form-label">Low Stock Threshold</label>
                <input type="number" class="form-control" id="edit-low-stock" name="low_stock_threshold" min="0" />
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label for="edit-image" class="form-label">Image URL</label>
                <input type="url" class="form-control" id="edit-image" name="image_url" maxlength="500" placeholder="https://..." />
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label for="edit-description" class="form-label">Description</label>
                <textarea class="form-control" id="edit-description" name="description" rows="3" maxlength="2000"></textarea>
                <div class="invalid-feedback"></div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary" id="edit-product-submit">
                <i class="bi bi-save me-1"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Adjust Stock Modal -->
    <div class="modal fade" id="adjust-stock-modal" tabindex="-1" aria-labelledby="adjust-stock-modal-label" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="adjust-stock-form">
            <input type="hidden" id="adjust-product-id" name="id" />
            <div class="modal-header">
              <h5 class="modal-title" id="adjust-stock-modal-label">Adjust Stock</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label for="adjust-type" class="form-label">Type *</label>
                <select class="form-select" id="adjust-type" name="movement_type" required>
                  <option value="purchase">Purchase (add stock)</option>
                  <option value="adjustment">Adjustment (add or remove)</option>
                </select>
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label for="adjust-quantity" class="form-label">Quantity *</label>
                <input type="number" class="form-control" id="adjust-quantity" name="quantity_change" required />
                <div class="invalid-feedback"></div>
                <small class="form-text text-muted">Enter a positive number for purchase. Positive or negative for adjustment.</small>
              </div>
              <div class="mb-3">
                <label for="adjust-reason" class="form-label">Reason *</label>
                <input type="text" class="form-control" id="adjust-reason" name="reason" maxlength="255" required />
                <div class="invalid-feedback"></div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary" id="adjust-stock-submit">
                <i class="bi bi-save me-1"></i> Apply
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Stock History Modal -->
    <div class="modal fade" id="stock-history-modal" tabindex="-1" aria-labelledby="stock-history-modal-label" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="stock-history-modal-label">Stock History</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div id="stock-history-content">
              <!-- Filled by products.js -->
            </div>
          </div>
          <div class="modal-footer">
            <div id="stock-history-pagination" class="me-auto">
              <!-- Pagination controls -->
            </div>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="delete-product-modal" tabindex="-1" aria-labelledby="delete-product-modal-label" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="delete-product-form">
            <input type="hidden" id="delete-product-id" name="id" />
            <div class="modal-header">
              <h5 class="modal-title" id="delete-product-modal-label">Confirm Deletion</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <p>Are you sure you want to delete "<span id="delete-product-name"></span>"?</p>
              <p class="text-muted mb-0">This action cannot be undone.</p>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-danger" id="delete-product-submit">
                <i class="bi bi-trash me-1"></i> Delete
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/pages/products.js"></script>
  </body>
</html>
