<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — MicroBiz</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
  </head>
  <body>
    <div id="app" class="dashboard-page">
      <div id="app-sidebar"></div>
      <div class="app-main">
        <header id="app-topbar"></header>
        <main class="app-content">
          <div class="dash-header">
            <div>
              <h1 class="dash-title">Overview</h1>
              <p class="dash-sub" id="greeting-sub">Loading…</p>
            </div>
            <div class="dash-actions">
              <a href="/orders" class="dash-btn dash-btn-primary">New order</a>
              <a href="/products" class="dash-btn dash-btn-secondary">Add product</a>
            </div>
          </div>

          <div class="stat-strip" id="stat-cards"></div>

          <div class="dash-panels">
            <div class="panel">
              <div class="panel-header">
                <h2 class="panel-title">Sales overview</h2>
                <a href="/orders" class="panel-link">View all</a>
              </div>
              <div class="panel-body" id="sales-chart-empty"></div>
            </div>
            <div class="panel">
              <div class="panel-header">
                <h2 class="panel-title">Low-stock products</h2>
                <a href="/products" class="panel-link">View all</a>
              </div>
              <div class="panel-body" id="low-stock-empty"></div>
            </div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <h2 class="panel-title">Recent orders</h2>
              <a href="/orders" class="panel-link">View all</a>
            </div>
            <div class="panel-body">
              <table class="orders-table">
                <thead>
                  <tr><th>Order</th><th>Customer</th><th>Status</th><th>Total</th></tr>
                </thead>
                <tbody>
                  <tr><td colspan="4" class="orders-empty">No orders to show yet.</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div id="toast-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/pages/dashboard.js"></script>
  </body>
</html>
