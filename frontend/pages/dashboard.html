<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — MicroBiz</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <div id="app">
      <div id="app-sidebar"></div>
      <div class="app-main">
        <header id="app-topbar"></header>
        <main class="app-content">
          <div
            class="d-sm-flex d-block justify-content-between align-items-start mb-4"
          >
            <div>
              <h1 class="h4 mb-1" id="greeting">Dashboard</h1>
              <p class="text-muted mb-0" id="greeting-sub">Loading…</p>
            </div>
          </div>

          <!-- Stat cards -->
          <div class="row g-3 g-md-4 mb-4" id="stat-cards">
            <!-- Filled in by dashboard.js -->
          </div>

          <!-- Placeholder panels -->
          <div class="panel-row">
            <div class="panel-col">
              <div class="card h-100 panel-card">
                <div class="card-header bg-white py-3">
                  <h2 class="h6 mb-0">Sales overview (chart)</h2>
                </div>
                <div class="card-body" id="sales-chart-empty"></div>
              </div>
            </div>
            <div class="panel-col">
              <div class="card h-100 panel-card">
                <div class="card-header bg-white py-3">
                  <h2 class="h6 mb-0">Low-stock alerts</h2>
                </div>
                <div class="card-body" id="low-stock-empty"></div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div id="toast-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/pages/dashboard.js"></script>
  </body>
</html>
