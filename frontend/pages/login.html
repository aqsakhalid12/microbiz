<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — MicroBiz</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand-icon"><i class="bi bi-shop"></i></div>
      <h1 class="auth-brand-title">MicroBiz</h1>
      <p class="auth-brand-subtitle">Log in to your account</p>
    </div>

    <!-- Server error alert (generic message from API) -->
    <div id="server-error" class="alert alert-danger d-none" role="alert"></div>

    <form id="login-form" class="auth-form" novalidate>
      <div class="form-group">
        <label for="email" class="form-label">Email address</label>
        <input type="email" class="form-control" id="email" name="email"
               autocomplete="email" required>
        <div class="invalid-feedback"></div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" name="password"
                 autocomplete="current-password" required>
          <button class="btn" type="button"
                  id="toggle-password" aria-label="Show password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <div class="invalid-feedback"></div>
      </div>

      <button type="submit" class="btn btn-primary-auth"
              id="submit-btn">Log in</button>
    </form>

    <div class="auth-footer">
      <p class="mb-0">
        Don't have an account? <a href="/register">Register</a>
      </p>
    </div>
  </main>

  <div id="toast-container"></div>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
