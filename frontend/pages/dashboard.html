<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — MicroBiz</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
  </head>
  <body>
    <div id="app" class="dashboard-page">
      <div id="app-sidebar"></div>
      <div class="app-main">
        <header id="app-topbar"></header>
        <main class="app-content">
          <div class="dash-header">
            <div>
              <h1 class="dash-title">Overview</h1>
              <p class="dash-sub" id="dash-subtitle"></p>
            </div>
            <div class="dash-actions">
              <select id="range-select" class="form-select form-select-sm">
                <option value="this_month">This month</option>
                <option value="last_30">Last 30 days</option>
                <option value="last_3m">Last 3 months</option>
                <option value="this_year">This year</option>
              </select>
              <a class="dash-btn dash-btn-primary" href="/orders">New order</a>
              <a class="dash-btn dash-btn-secondary" href="/products">Add product</a>
            </div>
          </div>

          <div class="stat-strip" id="stat-strip">
            <div class="stat-cell">
              <div class="stat-label-row"><i class="bi bi-currency-dollar"></i><span>Revenue</span></div>
              <p class="stat-value" id="stat-revenue">-</p>
              <div class="stat-caption" id="cap-revenue">caption</div>
            </div>
            <div class="stat-cell">
              <div class="stat-label-row"><i class="bi bi-graph-up-arrow"></i><span>Gross profit</span></div>
              <p class="stat-value" id="stat-gross">-</p>
              <div class="stat-caption" id="cap-gross">caption</div>
            </div>
            <div class="stat-cell">
              <div class="stat-label-row"><i class="bi bi-receipt"></i><span>Expenses</span></div>
              <p class="stat-value" id="stat-expenses">-</p>
              <div class="stat-caption" id="cap-expenses">caption</div>
            </div>
            <div class="stat-cell">
              <div class="stat-label-row"><i class="bi bi-piggy-bank"></i><span>Net profit</span></div>
              <p class="stat-value" id="stat-net">-</p>
              <div class="stat-caption" id="cap-net">caption</div>
            </div>
            <div class="stat-cell">
              <div class="stat-label-row"><i class="bi bi-bag-check"></i><span>Orders</span></div>
              <p class="stat-value" id="stat-orders">-</p>
              <div class="stat-caption" id="cap-orders">caption</div>
            </div>
            <div class="stat-cell">
              <div class="stat-label-row"><i class="bi bi-hourglass-split"></i><span>Pending orders</span></div>
              <p class="stat-value" id="stat-pending">-</p>
              <div class="stat-caption" id="cap-pending">caption</div>
            </div>
          </div>

          <div class="dash-panels">
            <div class="panel">
              <div class="panel-header">
                <h2 class="panel-title">Sales overview</h2>
              </div>
              <div class="panel-body">
                <div id="sales-chart"></div>
              </div>
            </div>
            <div class="panel">
              <div class="panel-header">
                <h2 class="panel-title">Low-stock products</h2>
                <a class="panel-link" href="/products">View all</a>
              </div>
              <div class="panel-body">
                <div id="low-stock-list"></div>
              </div>
            </div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <h2 class="panel-title">Recent orders</h2>
              <a class="panel-link" href="/orders">View all</a>
            </div>
            <div class="panel-body">
              <div id="recent-orders"></div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div id="toast-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/pages/dashboard.js"></script>
  </body>
</html>
