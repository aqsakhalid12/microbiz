<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customers — MicroBiz</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <div id="app">
      <div id="app-sidebar"></div>
      <div class="app-main">
        <header id="app-topbar"></header>
        <main class="app-content">
          <!-- Page header -->
          <div class="d-sm-flex d-block justify-content-between align-items-center mb-4">
            <h1 class="h4 mb-0">Customers</h1>
            <button type="button" class="btn btn-primary" id="add-customer-btn">
              <i class="bi bi-plus-lg me-1"></i> Add customer
            </button>
          </div>

          <!-- Filter bar -->
          <div class="card mb-3">
            <div class="card-body">
              <div class="row g-3 align-items-end">
                <div class="col-md-6">
                  <label for="search-input" class="form-label">Search</label>
                  <input type="text" class="form-control" id="search-input" placeholder="Search by name, email or phone..." />
                </div>
                <div class="col-md-3">
                  <label for="sort-select" class="form-label">Sort</label>
                  <select class="form-select" id="sort-select">
                    <option value="name:asc">Name (A-Z)</option>
                    <option value="name:desc">Name (Z-A)</option>
                    <option value="created_at:desc">Newest first</option>
                    <option value="created_at:asc">Oldest first</option>
                  </select>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                  <button type="button" class="btn btn-outline-secondary w-100" id="reset-filters-btn">
                    Reset
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Customers table / loading / empty / error state -->
          <div class="card">
            <div class="card-body">
              <div id="customers-content">
                <!-- Loading skeleton shown initially -->
              </div>
            </div>
          </div>

          <!-- Pagination controls -->
          <div id="pagination-controls" class="mt-3">
            <!-- Filled by customers.js -->
          </div>
        </main>
      </div>
    </div>

    <div id="toast-container"></div>
    <!-- Add Customer Modal -->
    <div class="modal fade" id="add-customer-modal" tabindex="-1" aria-labelledby="add-customer-modal-label" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <form id="add-customer-form">
            <div class="modal-header">
              <h5 class="modal-title" id="add-customer-modal-label">Add Customer</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div class="row g-3">
                <div class="col-md-6 mb-3">
                  <label for="add-name" class="form-label">Name *</label>
                  <input type="text" class="form-control" id="add-name" name="name" maxlength="150" required />
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="add-email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="add-email" name="email" maxlength="255" />
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="add-phone" class="form-label">Phone</label>
                  <input type="text" class="form-control" id="add-phone" name="phone" maxlength="30" />
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="add-address" class="form-label">Address</label>
                  <input type="text" class="form-control" id="add-address" name="address" maxlength="500" />
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-12 mb-3">
                  <label for="add-notes" class="form-label">Notes</label>
                  <textarea class="form-control" id="add-notes" name="notes" rows="3" maxlength="2000"></textarea>
                  <div class="invalid-feedback"></div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary" id="add-customer-submit">
                <i class="bi bi-save me-1"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- Edit Customer Modal -->
    <div class="modal fade" id="edit-customer-modal" tabindex="-1" aria-labelledby="edit-customer-modal-label" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <form id="edit-customer-form">
            <input type="hidden" id="edit-customer-id" name="id" />
            <div class="modal-header">
              <h5 class="modal-title" id="edit-customer-modal-label">Edit Customer</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div class="row g-3">
                <div class="col-md-6 mb-3">
                  <label for="edit-name" class="form-label">Name *</label>
                  <input type="text" class="form-control" id="edit-name" name="name" maxlength="150" required />
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="edit-email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="edit-email" name="email" maxlength="255" />
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="edit-phone" class="form-label">Phone</label>
                  <input type="text" class="form-control" id="edit-phone" name="phone" maxlength="30" />
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="edit-address" class="form-label">Address</label>
                  <input type="text" class="form-control" id="edit-address" name="address" maxlength="500" />
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-12 mb-3">
                  <label for="edit-notes" class="form-label">Notes</label>
                  <textarea class="form-control" id="edit-notes" name="notes" rows="3" maxlength="2000"></textarea>
                  <div class="invalid-feedback"></div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary" id="edit-customer-submit">
                <i class="bi bi-save me-1"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- View Customer Modal -->
    <div class="modal fade" id="view-customer-modal" tabindex="-1" aria-labelledby="view-customer-modal-label" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="view-customer-modal-label">Customer Details</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-4">
              <h6 class="text-muted mb-3">Customer Information</h6>
              <div class="row g-3">
                <div class="col-md-6">
                  <small class="text-muted d-block">Name</small>
                  <div id="view-name">—</div>
                </div>
                <div class="col-md-6">
                  <small class="text-muted d-block">Email</small>
                  <div id="view-email">—</div>
                </div>
                <div class="col-md-6">
                  <small class="text-muted d-block">Phone</small>
                  <div id="view-phone">—</div>
                </div>
                <div class="col-md-6">
                  <small class="text-muted d-block">Address</small>
                  <div id="view-address">—</div>
                </div>
                <div class="col-12">
                  <small class="text-muted d-block">Notes</small>
                  <div id="view-notes">—</div>
                </div>
              </div>
            </div>
            <div class="mb-4">
              <h6 class="text-muted mb-3">Stats</h6>
              <div class="row g-3">
                <div class="col-md-6">
                  <small class="text-muted d-block">Orders Count</small>
                  <div id="view-orders-count">0</div>
                </div>
                <div class="col-md-6">
                  <small class="text-muted d-block">Total Spent</small>
                  <div id="view-total-spent">0.00</div>
                </div>
              </div>
            </div>
            <div>
              <h6 class="text-muted mb-3">Order History</h6>
              <div id="order-history-content">
                <!-- Filled by customers.js -->
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>
    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="delete-customer-modal" tabindex="-1" aria-labelledby="delete-customer-modal-label" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="delete-customer-form">
            <input type="hidden" id="delete-customer-id" name="id" />
            <div class="modal-header">
              <h5 class="modal-title" id="delete-customer-modal-label">Confirm Deletion</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <p>Are you sure you want to delete "<span id="delete-customer-name"></span>"?</p>
              <p class="text-muted mb-0">This action cannot be undone.</p>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-danger" id="delete-customer-submit">
                <i class="bi bi-trash me-1"></i> Delete
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/pages/customers.js"></script>
  </body>
</html>
