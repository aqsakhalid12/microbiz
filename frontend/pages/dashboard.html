<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — MicroBiz</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <div id="app" class="dashboard-page">
      <div id="app-sidebar"></div>
      <div class="app-main">
        <header id="app-topbar"></header>
        <main class="app-content">
          <!-- Welcome banner -->
          <div class="welcome-banner mb-4">
            <div class="welcome-banner-inner">
              <div class="welcome-text">
                <h1 class="h3 fw-bold mb-1" id="greeting">Welcome back</h1>
                <p class="mb-0" id="greeting-sub">Loading…</p>
              </div>
              <div class="welcome-controls">
                <select class="form-select" disabled>
                  <option>This month</option>
                </select>
                <button type="button" class="btn btn-light" disabled>
                  <i class="bi bi-plus-lg"></i> Quick add
                </button>
              </div>
            </div>
          </div>

          <!-- Stat cards -->
          <div class="stat-card-grid" id="stat-cards">
            <!-- Filled in by dashboard.js -->
          </div>

          <!-- Sales overview + Low-stock alerts -->
          <div class="dashboard-panels mb-4">
            <div class="panel-sales">
              <div class="card h-100 panel-card">
                <div class="card-header bg-white py-3 panel-header">
                  <div>
                    <h2 class="h6 mb-0">Sales overview</h2>
                    <p class="text-muted small mb-0">
                      Charts will appear here once you have completed orders.
                    </p>
                  </div>
                </div>
                <div class="card-body" id="sales-chart-empty"></div>
              </div>
            </div>
            <div class="panel-lowstock">
              <div class="card h-100 panel-card">
                <div class="card-header bg-white py-3 panel-header">
                  <div>
                    <h2 class="h6 mb-0">Low-stock alerts</h2>
                    <p class="text-muted small mb-0">
                      Products below their low-stock threshold.
                    </p>
                  </div>
                </div>
                <div class="card-body" id="low-stock-empty"></div>
              </div>
            </div>
          </div>

          <!-- Recent orders -->
          <div class="mb-4">
            <div class="card h-100 panel-card">
              <div class="card-header bg-white py-3 panel-header">
                <div>
                  <h2 class="h6 mb-0">Recent orders</h2>
                  <p class="text-muted small mb-0">
                    Your latest orders across all statuses.
                  </p>
                </div>
              </div>
              <div class="card-body" id="recent-orders-empty"></div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div id="toast-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/pages/dashboard.js"></script>
  </body>
</html>
