<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expenses - MicroBiz</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <div id="app">
      <div id="app-sidebar"></div>
      <div class="app-main">
        <header id="app-topbar"></header>
        <main class="app-content">
          <!-- Page header -->
          <div class="page-header">
            <div>
              <h1 class="page-header-title">Expenses</h1>
              <p class="page-header-subtitle">Track and manage your business expenses.</p>
            </div>
            <button type="button" class="btn btn-primary ms-auto" id="add-expense-btn">
              <i class="bi bi-plus-lg me-1"></i> Add expense
            </button>
          </div>

          <!-- Filter bar -->
          <div class="card mb-3">
            <div class="card-body">
              <div class="row g-3 align-items-end">
                <div class="col-md-3">
                  <label for="search-input" class="form-label">Search</label>
                  <input
                    type="text"
                    class="form-control"
                    id="search-input"
                    placeholder="Search by description or category..."
                  />
                </div>
                <div class="col-md-2">
                  <label for="category-filter" class="form-label">Category</label>
                  <select class="form-select" id="category-filter">
                    <option value="">All Categories</option>
                  </select>
                </div>
                <div class="col-md-2">
                  <label for="date-from-filter" class="form-label">Date From</label>
                  <input type="date" class="form-control" id="date-from-filter" />
                </div>
                <div class="col-md-2">
                  <label for="date-to-filter" class="form-label">Date To</label>
                  <input type="date" class="form-control" id="date-to-filter" />
                </div>
                <div class="col-md-2">
                  <label for="sort-select" class="form-label">Sort</label>
                  <select class="form-select" id="sort-select">
                    <option value="expense_date:desc">Date (newest first)</option>
                    <option value="expense_date:asc">Date (oldest first)</option>
                    <option value="amount:desc">Amount (high to low)</option>
                    <option value="amount:asc">Amount (low to high)</option>
                  </select>
                </div>
                <div class="col-md-1 d-flex align-items-end">
                  <button
                    type="button"
                    class="btn btn-outline-secondary w-100"
                    id="reset-filters-btn"
                  >
                    Reset
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Summary strip (total amount and count for current filters) -->
          <div id="expenses-summary" class="mb-3 d-flex flex-wrap gap-3">
            <span class="badge bg-secondary">
              Total: <span id="summary-total">$0.00</span>
            </span>
            <span class="badge bg-secondary">
              Expenses: <span id="summary-count">0</span>
            </span>
          </div>

          <!-- Expenses table / loading / empty / error state -->
          <div class="card">
            <div class="card-body">
              <div id="expenses-content">
                <!-- Loading skeleton shown initially -->
              </div>
            </div>
          </div>

          <!-- Pagination controls -->
          <div id="pagination-controls" class="mt-3">
            <!-- Filled by expenses.js -->
          </div>
        </main>
      </div>
    </div>

    <div id="toast-container"></div>

    <!-- Add Expense Modal -->
    <div
      class="modal fade"
      id="add-expense-modal"
      tabindex="-1"
      aria-labelledby="add-expense-modal-label"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <form id="add-expense-form">
            <div class="modal-header">
              <h5 class="modal-title" id="add-expense-modal-label">Add Expense</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div class="row g-3">
                <div class="col-md-6 mb-3">
                  <label for="add-category" class="form-label">Category *</label>
                  <input
                    type="text"
                    class="form-control"
                    id="add-category"
                    name="category"
                    list="expense-category-list"
                    maxlength="80"
                    required
                  />
                  <datalist id="expense-category-list"></datalist>
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="add-expense-date" class="form-label">Date *</label>
                  <input
                    type="date"
                    class="form-control"
                    id="add-expense-date"
                    name="expense_date"
                    required
                  />
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="add-amount" class="form-label">Amount *</label>
                  <input
                    type="number"
                    class="form-control"
                    id="add-amount"
                    name="amount"
                    step="0.01"
                    min="0"
                    required
                  />
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="add-description" class="form-label">Description</label>
                  <input
                    type="text"
                    class="form-control"
                    id="add-description"
                    name="description"
                    maxlength="255"
                  />
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-12 mb-3">
                  <label for="add-notes" class="form-label">Notes</label>
                  <textarea
                    class="form-control"
                    id="add-notes"
                    name="notes"
                    rows="3"
                    maxlength="2000"
                  ></textarea>
                  <div class="invalid-feedback"></div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                Cancel
              </button>
              <button
                type="submit"
                class="btn btn-primary"
                id="add-expense-submit"
              >
                <i class="bi bi-save me-1"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Edit Expense Modal -->
    <div
      class="modal fade"
      id="edit-expense-modal"
      tabindex="-1"
      aria-labelledby="edit-expense-modal-label"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <form id="edit-expense-form">
            <input type="hidden" id="edit-expense-id" name="id" />
            <div class="modal-header">
              <h5 class="modal-title" id="edit-expense-modal-label">Edit Expense</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div class="row g-3">
                <div class="col-md-6 mb-3">
                  <label for="edit-category" class="form-label">Category *</label>
                  <input
                    type="text"
                    class="form-control"
                    id="edit-category"
                    name="category"
                    list="expense-category-list"
                    maxlength="80"
                    required
                  />
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="edit-expense-date" class="form-label">Date *</label>
                  <input
                    type="date"
                    class="form-control"
                    id="edit-expense-date"
                    name="expense_date"
                    required
                  />
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="edit-amount" class="form-label">Amount *</label>
                  <input
                    type="number"
                    class="form-control"
                    id="edit-amount"
                    name="amount"
                    step="0.01"
                    min="0"
                    required
                  />
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="edit-description" class="form-label">Description</label>
                  <input
                    type="text"
                    class="form-control"
                    id="edit-description"
                    name="description"
                    maxlength="255"
                  />
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-12 mb-3">
                  <label for="edit-notes" class="form-label">Notes</label>
                  <textarea
                    class="form-control"
                    id="edit-notes"
                    name="notes"
                    rows="3"
                    maxlength="2000"
                  ></textarea>
                  <div class="invalid-feedback"></div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                Cancel
              </button>
              <button
                type="submit"
                class="btn btn-primary"
                id="edit-expense-submit"
              >
                <i class="bi bi-save me-1"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div
      class="modal fade"
      id="delete-expense-modal"
      tabindex="-1"
      aria-labelledby="delete-expense-modal-label"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="delete-expense-form">
            <input type="hidden" id="delete-expense-id" name="id" />
            <div class="modal-header">
              <h5 class="modal-title" id="delete-expense-modal-label">Confirm Deletion</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <p>Are you sure you want to delete "<span id="delete-expense-name"></span>"?</p>
              <p class="text-muted mb-0">This action cannot be undone.</p>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                Cancel
              </button>
              <button
                type="submit"
                class="btn btn-danger"
                id="delete-expense-submit"
              >
                <i class="bi bi-trash me-1"></i> Delete
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/pages/expenses.js"></script>
  </body>
</html>
