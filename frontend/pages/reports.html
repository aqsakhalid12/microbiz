<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports - MicroBiz</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <div id="app">
      <div id="app-sidebar"></div>
      <div class="app-main">
        <header id="app-topbar"></header>
        <main class="app-content">
          <!-- Page header -->
          <div class="page-header">
            <div>
              <h1 class="page-header-title">Reports</h1>
              <p class="page-header-subtitle">View sales trends and expense breakdowns.</p>
            </div>
          </div>

          <!-- Filter card -->
          <div class="card mb-3">
            <div class="card-body">
              <div class="row g-3 align-items-end">
                <div class="col-md-3">
                  <label for="date-from" class="form-label">Date from</label>
                  <input type="date" class="form-control" id="date-from" />
                </div>
                <div class="col-md-3">
                  <label for="date-to" class="form-label">Date to</label>
                  <input type="date" class="form-control" id="date-to" />
                </div>
                <div class="col-md-3">
                  <label for="group-by" class="form-label">Group by</label>
                  <select class="form-select" id="group-by">
                    <option value="day">Day</option>
                    <option value="week">Week</option>
                    <option value="month">Month</option>
                  </select>
                </div>
                <div class="col-md-3 d-flex align-items-end gap-2">
                  <button type="button" class="btn btn-primary w-100" id="apply-btn">
                    Apply
                  </button>
                  <button type="button" class="btn btn-outline-secondary w-100" id="reset-btn">
                    Reset
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Loading / error placeholders -->
          <div id="reports-loading" class="text-center py-4">Loading...</div>
          <div id="reports-error" class="alert alert-danger d-none"></div>

          <!-- Summary panel -->
          <div id="report-summary" class="mb-3"></div>

          <!-- Sales trend panel -->
          <div class="card mb-3">
            <div class="card-body">
              <h5 class="card-title">Sales trend</h5>
              <div id="trend-chart"></div>
            </div>
          </div>

          <!-- Sales by period panel -->
          <div class="card mb-3">
            <div class="card-body">
              <h5 class="card-title">Sales by period</h5>
              <div class="table-responsive">
                <table class="table table-striped" id="trend-table">
                  <thead>
                    <tr>
                      <th>Period</th>
                      <th>Orders</th>
                      <th>Revenue</th>
                      <th>Gross profit</th>
                    </tr>
                  </thead>
                  <tbody id="trend-body"></tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Top products / Expenses by category panels -->
          <div class="row g-3">
            <div class="col-md-6">
              <div class="card">
                <div class="card-body">
                  <h5 class="card-title">Top products</h5>
                  <div id="top-products"></div>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="card">
                <div class="card-body">
                  <h5 class="card-title">Expenses by category</h5>
                  <div id="expense-categories"></div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/pages/reports.js"></script>
  </body>
</html>
